version: '3'

vars:
  BINARY: listenalong
  DIST: dist
  RELEASE: release
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  LDFLAGS: -s -w -X main.version={{.VERSION}}

tasks:
  default:
    deps: [fmt, vet, build]

  run:
    cmds:
      - go run -ldflags "{{.LDFLAGS}}" .

  build:
    cmds:
      - rm -rf {{.RELEASE}}
      - mkdir -p {{.RELEASE}}
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o {{.RELEASE}}/{{.BINARY}}-linux-amd64 .
      - CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o {{.RELEASE}}/{{.BINARY}}-win-amd64.exe .

  build-windows:
    env:
      GOOS: windows
      GOARCH: amd64
    cmds:
      - go build -ldflags "{{.LDFLAGS}}" -o {{.BINARY}}.exe .

  dist:
    deps: [clean-dist]
    cmds:
      - mkdir -p {{.DIST}}
      - CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o {{.DIST}}/{{.BINARY}}.exe .
      - CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "{{.LDFLAGS}}" -o {{.DIST}}/{{.BINARY}} .
      - cp config.json {{.DIST}}/

  fmt:
    cmds:
      - gofmt -w .

  vet:
    cmds:
      - go vet ./...

  test:
    cmds:
      - go test ./...

  tidy:
    cmds:
      - go mod tidy

  clean-dist:
    cmds:
      - rm -rf {{.DIST}}

  clean:
    cmds:
      - rm -f {{.BINARY}} {{.BINARY}}.exe
      - rm -rf {{.DIST}}
      - rm -rf {{.RELEASE}}
